services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: wms
      POSTGRES_PASSWORD: wms_local_password
      POSTGRES_DB: quantum_wms
    ports:
      - "5432:5432"
    volumes:
      - pg18_data:/var/lib/postgresql/data
      - ./src/lib/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./src/lib/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  wms-web:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://wms:wms_local_password@postgres:5432/quantum_wms
    depends_on:
      - postgres
      - redis

volumes:
  pg18_data:
  minio_data:
